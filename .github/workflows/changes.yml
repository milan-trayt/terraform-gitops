on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
        default: '[]'

jobs:
  echo_changed_folders:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(inputs.matrix)}}
    if: ${{fromJson(inputs.matrix).directory}} != '[]'
    steps:
      - name: Checkout code
        run : |
          echo"Checking out code"

      - name: Echo changed directories
        run: |
          echo "${{ matrix.directory }}"